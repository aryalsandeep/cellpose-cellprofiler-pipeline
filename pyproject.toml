[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cellseg_tools"
version = "0.0.1"
description = "Integrate Cell profiler and Cell pose"
authors = [
  { name = "Sandeep Aryal" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.8.0"


[tool.ruff]
line-length = 99
src = ["cellseg_tools"]
include = ["pyproject.toml", "cellseg_tools/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cellseg_tools"]
force-sort-within-sections = true

